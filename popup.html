<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="popup.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo-area">
          <img src="assets/ext-icon.png" class="logo" alt="Logo" />
          <h1 class="title">YT Bookmarker</h1>
        </div>
        <div class="header-actions" id="header-actions" style="display: none;">
          <button id="clear-all" title="Clear all bookmarks for this video">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
      </header>

      <main>
        <div class="video-info" id="video-info">
          <p class="subtitle">Bookmarks for this video</p>
        </div>

        <div class="bookmarks-list" id="bookmarks">
          <div class="loader-container">
            <div class="loader"></div>
          </div>
        </div>
      </main>

      <footer id="footer">
        <p>Press <span class="kbd">Alt+B</span> to bookmark instantly</p>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
